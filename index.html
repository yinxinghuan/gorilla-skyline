<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#58a8d8">
    <meta name="game-uuid" content="332cc83c-703e-47df-a15c-34b9c1fa67be">
    <meta name="description" content="Aim across a windy skyline and land one impossible banana.">
    <title>Skyline Gorillas</title>
    <style id="alteru-long-press-guard">html,body,#app,#root{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}img,svg,canvas{-webkit-user-drag:none}</style>
    <script src="./aigram-bridge.js"></script>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <main class="sg-app">
      <canvas id="game" aria-label="Skyline Gorillas artillery game"></canvas>

      <header class="sg-title">
        <span>ALTERU / BALLISTICS 12</span>
        <strong>SKYLINE / GORILLAS</strong>
      </header>

      <svg width="200" height="250" id="windmill" aria-hidden="true">
        <defs><path id="arm" d="M -7 -20 C -7 -10 7 -10 7 -20 L 2 -80 L -2 -80"></path></defs>
        <g transform="translate(100,100)"><g id="windmill-head">
          <circle r="8"></circle><use href="#arm"></use>
          <use href="#arm" transform="rotate(120)"></use>
          <use href="#arm" transform="rotate(-120)"></use>
        </g></g>
        <path transform="translate(100,0)" d="M -7 250 L 7 250 L 3 115 L -3 115"></path>
      </svg>
      <div id="wind-info"><span data-wind-label>WIND</span> <b id="wind-speed">0</b></div>

      <div id="info-left" class="sg-player">
        <h3><span class="name">AlterU</span></h3>
        <p><span data-angle-label>ANGLE</span> <b class="angle">0</b>°</p>
        <p><span data-power-label>POWER</span> <b class="velocity">0</b></p>
      </div>
      <div id="info-right" class="sg-player">
        <h3><span class="name">COMPUTER</span></h3>
        <p><span data-angle-label>ANGLE</span> <b class="angle">0</b>°</p>
        <p><span data-power-label>POWER</span> <b class="velocity">0</b></p>
      </div>

      <div id="instructions"><h3 id="game-mode">PLAYER VS COMPUTER</h3><h1></h1></div>
      <div id="bomb-grab-area" aria-label="Drag to aim"></div>

      <div class="sg-ghost" data-ghost aria-hidden="true">
        <i></i>
        <svg viewBox="0 0 24 24"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.92-1.38z"></path></svg>
      </div>

      <button id="lb" class="sg-champion" type="button" hidden></button>

      <section id="congratulations" class="sg-result" aria-live="polite">
        <span data-result-kicker></span>
        <h1><span id="winner">?</span></h1>
        <div><small data-score-label></small><strong id="final-score">0</strong></div>
        <p><span data-round-label></span> <b id="final-round">1</b> · <span id="score-breakdown"></span></p>
        <footer>
          <button type="button" data-again></button>
          <button type="button" data-rank></button>
        </footer>
      </section>

      <section id="lbFull" class="sg-leaderboard" aria-modal="true" role="dialog">
        <header><div><span>ALTERU</span><strong data-lb-title></strong></div>
          <button id="lbClose" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </header>
        <div id="lblist" class="sg-leaderboard__list"></div>
      </section>

      <div id="settings" hidden>
        <button id="color-mode" type="button">Dark Mode</button>
        <a class="single-player" href="#"></a><a class="two-players" href="#"></a><a class="auto-play" href="#"></a>
      </div>
      <button id="fullscreen" type="button" hidden><svg><path id="enter-fullscreen"></path><path id="exit-fullscreen"></path></svg></button>
      <div class="sg-flash" aria-hidden="true"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
